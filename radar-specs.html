<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill 增强简报中心</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .spec-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
      .spec-overview-card { border: 1px solid var(--line); border-radius: 24px; padding: 16px; background: rgba(255,250,240,.82); box-shadow: 0 14px 40px rgba(37,44,36,.08); }
      .spec-overview-card strong { display: block; font-size: 34px; line-height: 1; margin: 8px 0; }
      .spec-layout { display: grid; grid-template-columns: .78fr 1.22fr; gap: 18px; align-items: start; }
      .spec-list { display: grid; gap: 10px; }
      .spec-button { cursor: pointer; text-align: left; border: 1px solid var(--line); border-radius: 20px; padding: 14px; background: rgba(255,250,240,.78); font: inherit; color: inherit; }
      .spec-button.active { background: var(--acid); font-weight: 900; }
      .spec-panel { border: 1px solid var(--line); border-radius: 28px; padding: 20px; background: rgba(255,250,240,.84); box-shadow: 0 14px 40px rgba(37,44,36,.08); }
      .spec-meta, .spec-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .spec-signal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      .spec-signal-box { border: 1px solid var(--line); border-radius: 18px; padding: 14px; background: rgba(255,250,240,.7); }
      .spec-signal-box strong { display: block; margin-top: 6px; }
      .spec-copy { margin-top: 18px; border: 1px solid var(--line); border-radius: 22px; padding: 18px; background: rgba(255,250,240,.72); }
      .spec-copy h1, .spec-copy h2, .spec-copy h3 { margin: 0 0 10px; }
      .spec-copy h1 { font-size: 30px; }
      .spec-copy h2 { font-size: 22px; margin-top: 22px; }
      .spec-copy h3 { font-size: 18px; margin-top: 18px; }
      .spec-copy p, .spec-copy li { line-height: 1.75; }
      .spec-copy ul, .spec-copy ol { padding-left: 20px; margin: 10px 0; }
      .spec-copy code { padding: 2px 6px; border-radius: 999px; background: rgba(23,33,28,.08); font-size: .92em; }
      @media (max-width: 980px) {
        .spec-overview, .spec-signal-grid,
        .spec-layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <header class="hero">
      <nav class="topbar">
        <a class="brand" href="./index.html">
          <img src="./assets/avatars/logo.svg" alt="logo" class="brand-logo" /><span class="brand-mark">一人公司</span>
          <span>和它的员工们</span>
        </a>
        <div class="top-actions">
          <a class="ghost-link" href="./skill-radar.html">强 Skill 雷达</a>
          <a class="ghost-link" href="./growth-board.html">运营作战板</a>
          <a class="ghost-link" href="./launch-kits.html">发布素材包</a>
          <a class="ghost-link" href="./conversion-funnel.html">私域转化</a>
          <a class="ghost-link" href="../docs/daily-skill-radar/spec-index.md">原始索引</a>
        </div>
      </nav>
      <section class="hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">Enhancement Briefs</p>
          <h1>把雷达信号变成具体增强任务，而不是看完就忘。</h1>
          <p class="hero-subtitle">这里会按现有 Skill 和员工归属，把今天最值得增强的方向整理成可执行简报。你可以直接查看原因、动作和对应落地入口。</p>
        </div>
        <aside class="hero-panel">
          <div class="metric"><strong id="specCount">0</strong><span>增强简报</span></div>
          <div class="metric"><strong id="focusCount">0</strong><span>重点方向</span></div>
          <div class="metric"><strong id="briefTarget">0</strong><span>覆盖候选</span></div>
          <p class="panel-note">优先增强已经验证过、已经打包过、离推广和成交更近的 Skill。</p>
        </aside>
      </section>
    </header>
    <main>
      <section class="section">
        <div class="section-heading">
          <div><p class="eyebrow">Brief Queue</p><h2>今天先增强哪些 Skill</h2></div>
        </div>
        <div id="specOverview" class="spec-overview"></div>
        <div class="spec-layout">
          <div id="specList" class="spec-list"></div>
          <article id="specDetail" class="spec-panel"></article>
        </div>
      </section>
    </main>
    <script src="./public-status.js"></script>
    <script src="./radar-specs.js"></script>
  </body>
</html>
